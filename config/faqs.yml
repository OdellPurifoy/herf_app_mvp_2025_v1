faqs:
  - question: "What is HERF and how can it help my lounge?"
    answer: "HERF is a comprehensive management platform designed specifically for cigar lounges. It helps you manage memberships, create and promote events, send email notifications to members, and share special offers—all from one intuitive dashboard. HERF streamlines your operations so you can focus on providing an exceptional experience for your members."

  - question: "How do email notifications work?"
    answer: "When you create or update an event or special offer, HERF automatically sends email notifications to your active members who have opted in to receive communications. Members receive timely reminders about upcoming events (one week before and one day before), ensuring better attendance and engagement. You have full control over which members receive notifications."

  - question: "Can I manage RSVPs for my events?"
    answer: "Yes! HERF includes a complete RSVP management system. When you create an event that requires RSVPs, each member receives a unique RSVP link via email. They can easily confirm attendance, decline, or update their guest count. You can track responses in real-time from your dashboard and see detailed attendance metrics."

  - question: "What's the difference between the Corona and Toro plans?"
    answer: "The Corona plan ($19/month) is perfect for growing lounges with up to 300 members, 4 events per month, and 2 special offers. The Toro plan ($39/month) is designed for established lounges with unlimited members, unlimited events, unlimited special offers, and priority support. Both plans include email notifications and automated event reminders."

  - question: "How do automated event reminders work?"
    answer: "With the Corona and Toro plans, HERF automatically sends reminder emails to your members at two key times: one week before the event and one day before the event. These reminders include all event details, RSVP status, and links to update their response. This ensures maximum attendance without any manual effort from you."

  - question: "Can members opt out of notifications?"
    answer: "Yes. Lounge owners can manage notification preferences for each member through the dashboard. If a member requests to opt out of email notifications, you can easily update their preferences with a single click. This ensures compliance with communication preferences while maintaining member satisfaction."

  - question: "Is there a setup fee or contract?"
    answer: "No setup fees and no long-term contracts! You can subscribe on a month-to-month basis and cancel anytime. We believe in earning your business every month by providing exceptional value and service."

  - question: "How do I get started?"
    answer: "Getting started is easy! Simply sign up for an account, choose your plan (Corona or Toro), complete your lounge profile with photos and details, and start adding your members and events. Our intuitive interface makes it simple to get up and running in minutes."

  - question: "What kind of support do you offer?"
    answer: "All plans include email support with responses within 24 hours on business days. Toro plan subscribers receive priority email support with faster response times. We're committed to helping you succeed and are always here to answer questions or help troubleshoot any issues."
